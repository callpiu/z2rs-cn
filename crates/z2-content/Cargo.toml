[package]
name = "z2-content"
version = "0.1.0"
edition = "2021"
description = "z2rs new-area authoring: typed rooms, encoders to the game's byte formats, validation and generated static tables (see README.md)"
authors = ["troyedwardsjr"]
license = "MIT"

[lib]
name = "z2_content"
path = "src/lib.rs"

# No dependencies on purpose: z2-core will depend on this crate (so it must
# not depend on z2-core or z2-rando), and it must build for
# wasm32-unknown-unknown.
[dependencies]

[dev-dependencies]
# ROM-gated cross-checks only: the ported decoders are compared with
# z2-rando's on vanilla rooms read from the player's ROM at test time.
z2-assets = { path = "../z2-assets" }
z2-rando = { path = "../z2-rando" }
